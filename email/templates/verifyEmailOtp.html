<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>Verify your email</title>
    <style>
      body { margin:0; padding:0; background:#0b1220; color:#e5e7eb; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .wrap { max-width: 640px; margin: 0 auto; padding: 28px 18px; }
      .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 18px; padding: 22px; }
      .brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:0.02em; }
      .pill { display:inline-block; margin-top: 10px; padding: 6px 10px; border-radius:999px; background: rgba(197,160,89,0.14); border:1px solid rgba(197,160,89,0.35); color:#f5d08a; font-size:12px; }
      .code { font-size: 28px; font-weight: 900; letter-spacing: 0.1em; color:#f5d08a; padding: 14px 18px; background: rgba(197,160,89,0.12); border:1px dashed rgba(197,160,89,0.45); border-radius: 12px; text-align:center; }
      .btn { display:block; width: fit-content; margin-top: 18px; padding: 10px 14px; border-radius: 12px; text-decoration:none; background:#f5d08a; color:#0b1220; font-weight: 800; }
      .muted { color:#cbd5e1; font-size: 14px; line-height: 1.5; }
      @media (prefers-color-scheme: light) {
        body { background:#f6f7fb; color:#0f172a; }
        .card { background:#ffffff; border-color: rgba(15,23,42,0.1); }
        .pill { background: rgba(197,160,89,0.18); border-color: rgba(197,160,89,0.35); }
        .muted { color:#334155; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="brand">✨ Resume PRO</div>
        <div class="pill">Email Verification</div>
        <h2 style="margin: 14px 0 6px;">Enter this one-time code</h2>
        <p class="muted">Use the OTP below to verify your email address. This code expires soon for your security.</p>
        <div style="margin: 18px 0;" class="code">{{OTP}}</div>
        <p class="muted">If you didn’t request this, you can safely ignore this email.</p>
        <p class="muted" style="margin-top:18px;">— Resume PRO Security Team</p>
      </div>
    </div>
  </body>
</html>
