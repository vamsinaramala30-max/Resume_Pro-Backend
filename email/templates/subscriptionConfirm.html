<!DOCTYPE html>
<html lang="en">
<head>

    p { color: #94a3b8; line-height: 1.6; margin: 0 0 20px 0; }
    .button { display: inline-block; background: linear-gradient(135deg, #c5a059 0%, #d4af37 100%); color: #000; font-weight: 600; padding: 14px 28px; border-radius: 8px; text-decoration: none; margin: 20px 0; }
    .footer { text-align: center; color: #475569; font-size: 12px; margin-top: 30px; }

  <div class="container">
